# C-b is not acceptable -- Vim uses it
set-option -g prefix C-a
bind-key C-a last-window
bind-key <  swap-window -t -1
bind-key > swap-window -t +1
bind-key - split-window -v # Split panes vertically
bind-key | split-window -h # Split panes horizontal

# Start numbering at 1
set -g base-index 1

# Allows for faster key repetition
set -s escape-time 0

# Mouse scrolling
set -g mouse on
bind -n WheelUpPane   select-pane -t= \; copy-mode -e \; send-keys -M
bind -n WheelDownPane select-pane -t= \;                 send-keys -M

# automatically set window title
setw -g automatic-rename

# Push a title to the outer terminal (Ghostty) so the titlebar always shows
# the session and host, e.g. "simon @ bunker"
set -g set-titles on
set -g set-titles-string "#S @ #H"

# Set the default terminal mode to 256color mode
set -g default-terminal "screen-256color"


# Allows us to use C-a a <command> to send commands to a TMUX session inside 
# another TMUX session
bind-key a send-prefix

# Activity monitoring
#setw -g monitor-activity on
#set -g visual-activity on

# Increase history
set-option -g history-limit 5000

# Example of using a shell command in the status line
#set -g status-right "#[fg=yellow]#(uptime | cut -d ',' -f 2-)"

# Solarized colors from seebi/tmux-colors-solarized (tmuxcolors-{light,dark}.conf).
# tmux is one server per host, but the attached terminal's theme varies
# (Ghostty: Solarized Dark locally, Solarized Light on bunker), so pick the
# variant matching the attached client's background color at load time.
# NOTE: re-run `tmux source-file ~/.tmux.conf` after changing a client's theme.
if-shell -F '#{m/r:#fdf6e3,#{client_bg}}' {
  #### COLOUR (Solarized light)

  # default statusbar colors
  set-option -g status-style fg=yellow,bg=white #yellow and base2

  # default window title colors
  set-window-option -g window-status-style fg=brightyellow,bg=default #base0 and default

  # active window title colors
  set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default

  # pane border
  set-option -g pane-border-style fg=white #base2
  set-option -g pane-active-border-style fg=brightcyan #base1

  # message text
  set-option -g message-style fg=brightred,bg=white #orange and base2

  # pane number display
  set-option -g display-panes-active-colour blue #blue
  set-option -g display-panes-colour brightred #orange

  # clock
  set-window-option -g clock-mode-colour green #green

  # bell
  set-window-option -g window-status-bell-style fg=white,bg=red #base2, red
} {
  #### COLOUR (Solarized dark)

  # default statusbar colors
  set-option -g status-style fg=yellow,bg=black #yellow and base02

  # default window title colors
  set-window-option -g window-status-style fg=brightblue,bg=default #base0 and default

  # active window title colors
  set-window-option -g window-status-current-style fg=brightred,bg=default #orange and default

  # pane border
  set-option -g pane-border-style fg=black #base02
  set-option -g pane-active-border-style fg=brightgreen #base01

  # message text
  set-option -g message-style fg=brightred,bg=black #orange and base01

  # pane number display
  set-option -g display-panes-active-colour brightred #orange
  set-option -g display-panes-colour blue #blue

  # clock
  set-window-option -g clock-mode-colour green #green

  # bell
  set-window-option -g window-status-bell-style fg=black,bg=red #base02, red
}

# iterm2 and control mode needs this off
set-window-option -g aggressive-resize off

# powerline bits
# All colors are ANSI palette indices (colour0-15) so segments follow the
# attached terminal's Solarized theme; colour15 is #fdf6e3 in both variants
# so pill text stays legible on any accent background.
set-option -g status on
set-option -g status-justify "left"
set-option -g status-left-length 40
set-option -g status-right-length 80
set-option -g status-interval 15

# left: session@host pill -> current directory -> window list
set-option -g status-left '#[fg=colour15,bg=colour4,bold] #S@#h #[fg=colour4,bg=default]#[fg=colour6,bold] #{b:pane_current_path} #[fg=colour6]'

# window list: dim pill for inactive windows, orange for the active one,
# #F shows activity (*), bell (!) and zoom (Z) flags
set-window-option -g window-status-format         '#[fg=colour15,bg=colour8] #I #W#F #[fg=colour8,bg=default]'
set-window-option -g window-status-current-format '#[fg=colour15,bg=colour9,bold] #I #W#F #[fg=colour9,bg=default]'

# right: state indicators (only shown when active) -> git branch of the
# focused pane (nothing when not in a repo) -> load average -> clock
set-option -g status-right '#{?client_prefix,#[fg=colour15,bg=colour3,bold] PREFIX ,}#{?pane_in_mode,#[fg=colour15,bg=colour3] COPY ,}#{?pane_synchronized,#[fg=colour15,bg=colour5] SYNC ,}#[fg=colour2]#(cd #{pane_current_path} && b=$(git rev-parse --abbrev-ref HEAD 2>/dev/null) && [ -n "$b" ] && printf " %s " "$b")#[fg=colour15,bg=colour6] #(cut -d" " -f1-3 /proc/loadavg) #[fg=colour6,bg=default]#[fg=colour15,bg=colour2] %H:%M #[fg=colour2,bg=default]'

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

new-session -A -s simon -n "htop"  'htop'
new-window  -t 2 -n        "logs"  'journalctl -f'
new-window  -t 3 -n        "zsh"   'zsh'
selectw -t 3

# renumber windows
set-option -g renumber-windows on

# display error messages for longer
set-option -g display-time 4000
